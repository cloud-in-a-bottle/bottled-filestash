[app]
name = "filestash"
version = "1.0.0"
description = "Web-based file manager supporting multiple storage backends (S3, SFTP, FTP, WebDAV, Git, etc.)"

[runtime.container]
image = "Dockerfile"
# Cloud in a Bottle pulls this signed prebuilt image (built from the release tag's commit by CI) instead of building
# `image`. If you fork this app and change it, comment this line out so your instance builds `image` instead.
prebuilt_image = "registry.cloudinabottle.org/bottled-filestash"
port = 8334

[resources]
memory_mb = 256
cpu_cores = 0.5

[data]
access_all_app_data = true
